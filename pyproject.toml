[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repoctx"
version = "0.1.0"
description = "Native Go repository context compiler"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Travis DeShazo" },
]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Go",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
repoctx = "repoctx_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["repoctx_cli*"]

[tool.setuptools.package-data]
repoctx_cli = ["bin/repoctx", "bin/repoctx.exe"]
