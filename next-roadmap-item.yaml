# Pinned to M3-01, the first unchecked work item when authored.
# Run from the repository root; see docs/workflows/next-roadmap-item.md.
agentic-loop:
  config:
    name: repoctx-roadmap-m3-01-artifact-schema
    stateful: true
    checkpoint_interval: 1
    max_iterations: 12
    timeout_seconds: 0
    context_window: 2
    exit_condition: pattern_match
    exit_pattern: '(?m)^(ROADMAP_ITEM_COMPLETE|ROADMAP_ITEM_BLOCKED)$'
    allowed_paths: [ . ]
    tools: [Read, Write, Edit, Bash]

  steps:
    - plan_contract:
        input: ROADMAP.md
        model: openai-codex
        action: |
          Follow applicable AGENTS.md and skills. Complete only M3-01, "Define a
          minimal optional artifact schema", in ROADMAP.md. M0, M1 and M2 are
          recorded complete. Confirm their prerequisite evidence and read M3,
          the cross-cutting gates and execution rules. Do not advance to M3-02
          or implement the whole M3 milestone. The roadmap's YAML is design only.

          Iteration {{ loop.iteration }} of {{ loop.total_iterations }}.
          Previous report (context, not proof): {{ loop.previous_output }}
          Inspect git status, recent commits, docs/IR.md, docs/AGENT_CONTEXT.md,
          current schemas and relevant compiler/IR/context APIs. Preserve all
          pre-existing changes. Reconcile docs/reports/m3-01-evidence.md and
          docs/design/m3-01-artifact-schema.md if present with the actual tree.
          Recover unfinished work before creating new work. If M3-01 is already
          checked, audit its evidence; never select a different item on resume.

          Write or refine the design record before implementation. Record owner
          (this workflow's implementation role), prerequisites, intended public
          contract, compatibility decision, affected surfaces and test matrix.
          Cover stable IDs, kind, owner, applicability, lifecycle, exact source
          spans, declared inputs and relationships. Start with components,
          decisions, contracts, requirements and verification obligations.
          Specify field types, required/optional fields, ID stability and
          namespace rules, path/span coordinates, unknown fields, versions,
          malformed inputs, resource bounds and source-only behavior. Separate
          schema validation from later authority resolution and adapters.
          Prefer an additive optional contract; justify any IR/context change
          with explicit versions and migration, never silent wire changes.
          Repository declarations must not authorize commands, widen scope,
          resolve normative conflicts, or manufacture verification results.

          Create/update the evidence document with exact M3-01 text, baseline
          revision, pre-existing changes, plan, acceptance criteria and blockers.
          Carry this handoff through all steps. Report READY or BLOCKED with a
          concrete reason. Do not implement code or change roadmap checkboxes.
        output: STDOUT

    - review_contract:
        input: STDIN
        model: openai-codex
        action: |
          Act as an independent design reviewer. Read the design, evidence and
          actual existing contracts. Check complete M3-01 field/kind coverage,
          minimality, optionality, exact provenance, declared-input identity,
          compatibility and the trust boundary. Check that proposed acceptance
          tests can establish the contract without implementing M3-02 through
          M3-05. Do not edit files. Preserve incoming blockers. Return
          DESIGN_ACCEPTED or DESIGN_REWORK with concrete findings and locations.
          Do not approve unspecified wire meanings or missing migration choices.
        output: STDOUT

    - implement_contract:
        input: STDIN
        model: openai-codex
        action: |
          Follow applicable repository instructions and preserve the handoff.
          If externally blocked, record and forward the blocker without code
          changes. If DESIGN_REWORK, revise only the design and evidence, then
          defer implementation until the next iteration's independent design
          review accepts it. Otherwise record the accepted design review and
          implement the minimal M3-01 contract with appropriate public types,
          machine-readable schema, validation, fixtures and documentation as
          specified by the design. Do not stop at a design-only proposal.

          Cover each supported kind and field, malformed records, exact source
          references, declared-input representations, version/unknown-field
          behavior and absence of optional metadata. Demonstrate that existing
          source-only compilation and context retrieval still work. Keep schema
          validity separate from authority, semantic resolution and check
          execution. Add no automatic catalog discovery, executable providers,
          check runners or M3-02 conflict resolution unless strictly necessary
          for the accepted minimal schema; record any such prerequisite.

          Run targeted contract tests, format changes and document migration
          and limitations. Record commands, exit codes and artifacts in
          docs/reports/m3-01-evidence.md. Commit only cohesive in-scope changes
          after inspecting the staged diff, leaving pre-existing changes alone.
          Record implementation revisions; do not push or change checkboxes.
        output: STDOUT

    - review_implementation:
        input: STDIN
        model: openai-codex
        action: |
          Independently inspect actual code, fixtures, schema and docs against
          the accepted design and every M3-01 requirement. Do not edit files.
          Preserve design rework or external blockers rather than mistaking
          skipped implementation for acceptance. Review round trips, malformed
          input handling, stable identifiers, exact byte spans, scoped paths,
          optionality, compatibility and source-only regressions. Verify that
          tests cover behavior and do not merely mirror the implementation.
          Confirm metadata stays untrusted and no declaration executes a check.
          Report substantiated findings with file locations, missing evidence
          and repairs. Keep scope limited to M3-01 and necessary prerequisites.
        output: STDOUT

    - correct_findings:
        input: STDIN
        model: openai-codex
        action: |
          Fix substantiated in-scope implementation findings and failed targeted
          checks. Preserve external blockers. If the design still needs review,
          record that status and do not implement it prematurely. Any material
          contract change must return through design review next iteration.
          Rerun checks affected by corrections; do not weaken assertions or
          accepted criteria to pass. Commit only reviewed in-scope changes.
          Persist the full handoff in docs/reports/m3-01-evidence.md before the
          tool step: design verdict, implementation commits, finding dispositions,
          targeted checks, pending work and blockers. Do not check M3-01 yet.

          The next step runs the existing baseline runner directly. Ensure
          required Python test dependencies and Go/C toolchains are available;
          report unavailable prerequisites, never replace checks with a claim.
        output: STDOUT

    - deterministic_regression_gate:
        input: 'tool: python3 scripts/m0_baseline.py --output artifacts/m3-01-baseline.json'
        model: NA
        action: NA
        tool:
          allowlist: [python3]
          timeout: 3600
        output: STDOUT

    - final_review:
        input: STDIN
        model: openai-codex
        action: |
          Act as an independent final reviewer; make no edits. Read ROADMAP.md,
          the design, durable evidence, actual implementation and the fresh
          artifacts/m3-01-baseline.json. The preceding deterministic command
          must have succeeded. Check report freshness against this invocation,
          its revision/dirty state and source digest; old results are not proof.
          Audit every M3-01 field/kind, the accepted design and compatibility
          decision, targeted contract/schema tests, source-only regressions and
          all review finding dispositions. The baseline alone does not validate
          a newly introduced artifact schema: require dedicated schema evidence.
          Check that targeted evidence covers the implementation after repairs.

          Return ACCEPTED only for the whole M3-01 item with no unresolved
          findings or missing evidence. Return REWORK for fixable code/design
          findings, BLOCKED for external prerequisites. Include reviewed HEAD,
          relevant working-tree changes, commands/results, and pending work.
          No test result proves authority or the whole M3 milestone complete.
        output: STDOUT

    - record_progress:
        input: STDIN
        model: openai-codex
        action: |
          Preserve the final review verdict. Make documentation-only changes.
          Retain the machine-readable baseline report as evidence for this run
          at docs/reports/m3-01-baseline.json, with its original revision, digest,
          environment and results intact. Link it and targeted contract evidence
          from docs/reports/m3-01-evidence.md together with implementation commits,
          design review, final review, findings and explicit limitations.
          Distinguish tested code from subsequent documentation-only commits.

          Only after ACCEPTED, check exactly M3-01 and add a link to its evidence
          in ROADMAP.md. Leave M3-02 through M3-05 and M3 acceptance gates
          unchanged. For REWORK/BLOCKED, leave M3-01 unchecked (reopen premature
          completion with a recorded reason) and retain the work remaining.
          Check links and run git diff --check. Inspect the staged diff and
          commit only these in-scope documentation/report changes. Do not push,
          merge, publish, deploy, or start another item. Report the verdict,
          tested revision, documentation commit and exact remaining work.
        output: STDOUT

    - report_iteration:
        input: STDIN
        model: openai-codex
        action: |
          Read actual roadmap/design/evidence and verify this iteration's final
          verdict and bookkeeping. Do not edit. Summarize work, revisions,
          checks, review and remaining limitations. End with exactly one
          standalone status line, printing no other terminal marker:
          ROADMAP_ITEM_COMPLETE only when all M3-01 requirements are implemented,
          independently accepted, supported by current passing checks and linked
          evidence, and its checkbox is checked.
          ROADMAP_ITEM_BLOCKED for an external prerequisite preventing progress;
          explain the concrete recovery action without claiming completion.
          Otherwise CONTINUE for design review, implementation, repairs or
          missing final audit. The iteration limit never establishes success.
        output: STDOUT
